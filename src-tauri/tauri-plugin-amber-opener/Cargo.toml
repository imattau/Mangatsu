[package]
name = "tauri-plugin-amber-opener"
version = "0.1.0"
edition = "2021"
description = "Launches NIP-55 signer apps (e.g. Amber) via nostrsigner: URLs with the Browser.EXTRA_APPLICATION_ID extra Amber requires for its web-app request parser."
links = "tauri-plugin-amber-opener"

[lib]
name = "tauri_plugin_amber_opener"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
